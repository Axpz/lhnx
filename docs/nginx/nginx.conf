events {
    worker_connections 8192;
}

stream {
    error_log /var/log/nginx/error.log warn;

    upstream mqtt_backend {
        server rabbitmq:1883;   # RabbitMQ MQTT 插件明文端口
    }

    server {
        listen 8883 ssl;
        proxy_pass mqtt_backend;

        ssl_certificate /etc/nginx/ssl/mqtt.crt;
        ssl_certificate_key /etc/nginx/ssl/mqtt.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4:!DES:!3DES:!EXPORT:!NULL;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        ssl_handshake_timeout 30s;

        proxy_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffer_size 32k;
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    proxy_connect_timeout 1800s;
    proxy_send_timeout    1800s;
    proxy_read_timeout    1800s;

    # 如果启用 client 上传等：
    client_body_timeout   1800s;
    client_header_timeout 1800s;

    client_max_body_size 2048m;

    log_format combined_remoteip '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    upstream frontend {
        server nt-frontend:3000;
    }

    upstream api_backend {
        server nt:8080;
    }

    # HTTP -> 自动跳转 HTTPS
    server {
        listen 80;
        server_name heatpatch.axpz.org;
    #     return 301 https://$host$request_uri;
    # }

    # # 主服务（HTTPS）
    # server {
    #     listen 443 ssl;
    #     server_name komifu.com;

        # ssl_certificate     /etc/nginx/ssl/iot.komifu.com.pem;
        # ssl_certificate_key /etc/nginx/ssl/iot.komifu.com.key;
        #ssl_certificate /etc/nginx/ssl/mqtt.crt;
        #ssl_certificate_key /etc/nginx/ssl/mqtt.key;

        # 静态资源 /public/
        location /public/ {
            alias /app/public/;
            autoindex on;
            try_files $uri $uri/ =404;
            expires 30d;
            access_log off;
        }

        # WebSocket 路由
        location /api/v1/ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # API 路由
        location /api/v1 {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # 其余前端页面
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}