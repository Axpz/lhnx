services:
  nginx:
    image: nginx:alpine
    container_name: lhnx-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 16m
    ports:
      - "127.0.0.1:17633:80"
    volumes:
      #- ./volumes/scada/ssl:/etc/nginx/ssl:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 30s
      timeout: 10s
      retries: 3
  lhnx-frontend:
    image: lhnx-frontend-linux-amd64:latest
    container_name: lhnx-frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384m
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 30s
      timeout: 10s
      retries: 3
